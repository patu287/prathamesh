name: Build Reset APK

# Builds the Android WebView wrapper around reset/index.html and uploads the APK
# as a workflow artifact. Runs on every push to the working branch, and can be
# started by hand from the Actions tab.
on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'android/**'
      - 'reset/index.html'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sync web app into Android assets
        run: cp reset/index.html android/app/src/main/assets/index.html

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APKs
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Reset-1.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Reset-1.0-debug.apk
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reset-apk
          path: out/*.apk
          if-no-files-found: error
