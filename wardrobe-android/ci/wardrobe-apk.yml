name: Build My Wardrobe APK
on:
  push:
    branches: ['arena/**']
    paths: ['wardrobe-android/**', 'almari/**', '.github/workflows/wardrobe-apk.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: {distribution: temurin, java-version: '17'}
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with: {gradle-version: '8.7'}
    - name: Sync web app into Android assets
      run: mkdir -p wardrobe-android/app/src/main/assets && for f in index.html styles.css app.js data.js store.js; do cp "almari/$f" wardrobe-android/app/src/main/assets/; done && ls -lh wardrobe-android/app/src/main/assets
    - name: Build APKs
      working-directory: wardrobe-android
      run: gradle assembleRelease --no-daemon --stacktrace
    - name: Collect APKs
      run: mkdir -p out && cp wardrobe-android/app/build/outputs/apk/release/app-release.apk out/MyWardrobe-1.0.apk && ls -lh out
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with: {name: my-wardrobe-apk, path: out/*.apk, if-no-files-found: error}
