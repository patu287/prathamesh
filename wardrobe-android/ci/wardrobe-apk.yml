name: Build My Wardrobe APK

# Builds the Android WebView wrapper around almari/ and uploads the signed APK
# as a workflow artifact. The wrapper itself has no INTERNET permission, so the
# produced APK runs fully offline.
#
# Runs on every push that touches the wrapper, the web app, or this workflow,
# and can also be started by hand from the Actions tab.
on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'wardrobe-android/**'
      - 'almari/**'
      - '.github/workflows/wardrobe-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # The web app is the single source of truth; the wrapper just ships it.
      # Only the runtime files go into assets — never serve.py or README.md.
      - name: Sync web app into Android assets
        run: |
          mkdir -p wardrobe-android/app/src/main/assets
          for f in index.html styles.css app.js data.js store.js; do
            cp "almari/$f" wardrobe-android/app/src/main/assets/
          done
          ls -lh wardrobe-android/app/src/main/assets

      # The release keystore is committed (keys/wardrobe.keystore, alias and
      # password both "wardrobe") so every build is signed with the same key
      # and installs over the previous one. No debug keystore needed.
      - name: Build APKs
        working-directory: wardrobe-android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK=wardrobe-android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          # Confirm the APK actually contains the web app and was signed.
          python3 - <<'PY'
          import zipfile, sys
          p = 'wardrobe-android/app/build/outputs/apk/release/app-release.apk'
          z = zipfile.ZipFile(p)
          names = z.namelist()
          for need in ('assets/index.html', 'assets/app.js', 'assets/data.js',
                       'assets/store.js', 'assets/styles.css',
                       'AndroidManifest.xml', 'classes.dex'):
              assert need in names, 'missing from APK: ' + need
          print('APK contents OK: %d entries' % len(names))
          print('assets/index.html bytes:', len(z.read('assets/index.html')))
          PY

      - name: Collect APKs
        run: |
          mkdir -p out
          cp wardrobe-android/app/build/outputs/apk/release/app-release.apk out/MyWardrobe-1.0.apk
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-wardrobe-apk
          path: out/*.apk
          if-no-files-found: error
