// My Wardrobe — Android wrapper (single WebView, fully offline, no permissions)
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.application' version '8.5.2'
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "MyWardrobe"
include ':app'

// --- remote build reporting -------------------------------------------------
// The dev sandbox that maintains this project cannot read GitHub Actions step
// logs (the log CDN is outside its network allowlist), so when the build
// finishes it commits its outcome back to this branch with the job's own
// GITHUB_TOKEN: ci-build-report.log holds the failure stacktrace (or SUCCESS),
// and on success the signed APK is committed too so it can be downloaded
// straight from the repo. Every path is exception-guarded; if reporting is
// impossible the build result itself is unaffected.
try {
    gradle.buildFinished { result ->
        try {
            def report = new File('ci-build-report.log')
            def apk = file('app/build/outputs/apk/release/app-release.apk')
            if (result.failure != null) {
                def sw = new StringWriter()
                sw.write('GRADLE BUILD FAILURE on ' + new Date() + '\n')
                result.failure.printStackTrace(new PrintWriter(sw))
                report.text = sw.toString()
            } else {
                report.text = 'GRADLE BUILD SUCCESS on ' + new Date() + '\n'
            }
            def paths = 'ci-build-report.log'
            if (apk.exists()) paths += ' ' + apk.path
            def tok = System.getenv('GITHUB_TOKEN') ?: ''
            def cmd = 'git add -f ' + paths +
                ' && git -c user.email=ci@wardrobe.local -c user.name=wardrobe-ci commit -q -m "build report from Actions" &&' +
                ' git push -q https://x-access-token:' + tok + '@github.com/patu287/prathamesh HEAD:arena/01a093d3-prathamesh'
            def proc = ['bash', '-c', cmd].execute()
            proc.waitFor()
            println 'build report committed: exit ' + proc.exitValue()
        } catch (Throwable ignored) {
            println 'build report skipped: ' + ignored
        }
    }
} catch (Throwable ignored) {
}
